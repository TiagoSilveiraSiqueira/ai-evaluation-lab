name: Testes e fixtures offline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Executar testes sem dependências externas
        run: python -m unittest discover -s tests -v
      - name: Verificar fixture de referência
        run: python evaluate.py --responses examples/improved.json --dataset dataset.json --require-all --output local/ci-report.json
      - name: Comparar fixtures ilustrativas
        run: python evaluate.py --responses examples/baseline.json --dataset dataset.json --compare examples/improved.json --output local/ci-comparison.json
